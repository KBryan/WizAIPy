# Agentic Engineering Framework — manifest.yml
# Universal machine-readable project entry point
# https://github.com/Superlogic/AgenticEngineeringFramework
#
# Generated by /prime on 2026-09-14 — edit freely. Re-run /prime to refresh.

# Stamped with the adws package version that initialized this project.
# `adws status` compares it against the installed CLI; `adws upgrade` refreshes it.
framework_version: "2.12.1"

project:
  name: "WizAIPy"
  description: "NFT-gated AI crypto trading bot: LLM prompt-to-trade, Uniswap execution on Ethereum/SKALE/Beam, FastAPI + Celery"
  type: "service"
  language: "Python 3.12"
  framework: "FastAPI"
  repository_type: "single"

entry: "api/main.py"

entry_points:
  readme: "README.md"
  agents: "AGENTS.md"
  env: "env.example"
  manifest: "manifest.yml"
  api: "api/main.py"
  worker: "core/celery_app.py"
  settings: "config.py"

paths:
  source: "api/"
  tests: "tests/"
  docs: "docs/"
  scripts: "scripts/"
  adws: ".adws/"
  api/:            { what: "FastAPI app, middleware, routers",                 risk: medium }
  api/auth.py:     { what: "JWT + NFT-ownership auth",                         risk: high }
  api/deps.py:     { what: "FastAPI deps, NFT verification",                   risk: high }
  api/routers/:    { what: "HTTP endpoints (health, auth, trade, admin)",      risk: medium }
  core/:           { what: "Domain logic: models, tasks, execution, NLP",      risk: medium }
  core/execution/: { what: "On-chain trade execution with wallet key",         risk: high }
  core/strategies/: { what: "Trading strategy framework + momentum",           risk: medium }
  core/nlp/:       { what: "Multi-provider LLM client (prompt -> trade)",      risk: medium }
  integrations/:   { what: "Uniswap (web3), CoinGecko, Twitter adapters",      risk: high }
  config.py:       { what: "Pydantic Settings + network/LLM/exchange constants", risk: high }
  alembic/:        { what: "Alembic DB migrations",                            risk: high }
  tests/:          { what: "pytest unit + integration suites",                 risk: low }
  scripts/:        { what: "deploy.sh, DB init",                               risk: low }
  k8s/:            { what: "Kubernetes manifests",                             risk: low }
  docs/:           { what: "API + deployment docs",                            risk: low }

# Validation commands. Tests need the 7 required env vars from config.Settings
# (see AGENTS.md > Development Commands > Validation for a hermetic export line).
validation:
  test: ".venv/bin/python -m pytest -p no:cacheprovider"
  lint: ".venv/bin/python -m flake8 api core integrations config.py tests"
  format: ".venv/bin/python -m black --check ."
  typecheck: ".venv/bin/python -m mypy"
  build: "docker build -t wizaipy ."

validate:
  test: ".venv/bin/python -m pytest -p no:cacheprovider"
  lint: ".venv/bin/python -m flake8 api core integrations config.py tests"
  format: ".venv/bin/python -m black --check ."
  typecheck: ".venv/bin/python -m mypy"
  build: "docker build -t wizaipy ."

run:
  dev: ".venv/bin/uvicorn api.main:app --reload --host 0.0.0.0 --port 8000"
  worker: ".venv/bin/celery -A core.celery_app worker --loglevel=info"
  beat: ".venv/bin/celery -A core.celery_app beat --loglevel=info"
  prod: "gunicorn api.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
  compose: "docker-compose up -d"

setup:
  venv: "uv venv --python 3.12 .venv"
  install: "uv pip install --python .venv/bin/python -r requirements.txt 'setuptools<81' 'eth-typing<5' pytest-cov"
  migrate: ".venv/bin/python -m alembic upgrade head"
